version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smart_validator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/neo4j123
    ports:
      - "7474:7474"
      - "7687:7687"
